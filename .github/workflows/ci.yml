name: M2 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devmemoir
          POSTGRES_PASSWORD: devmemoir
          POSTGRES_DB: devmemoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmemoir -d devmemoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
      DATABASE_DIRECT_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
      TEST_DATABASE_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
