name: DevMemoir CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: DevMemoir CI / verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devmemoir
          POSTGRES_PASSWORD: devmemoir
          POSTGRES_DB: devmemoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmemoir -d devmemoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      DATABASE_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
      DATABASE_DIRECT_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
      TEST_DATABASE_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public repository current-tree check
        run: pnpm audit:public
      - name: Assert PostgreSQL integration configuration
        run: test -n "$TEST_DATABASE_URL"
      - name: Apply empty/upgrade-safe migrations
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and M1-M4 regression tests
        run: pnpm test
      - name: PostgreSQL integration, projection, and RLS tests
        run: pnpm --filter @devmemoir/db test
      - name: pg-boss restart integration tests
        run: pnpm --filter @devmemoir/jobs test && pnpm --filter @devmemoir/worker test
      - name: Build
        run: pnpm build
