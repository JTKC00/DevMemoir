name: DevMemoir CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!README.md'
      - '!SECURITY.md'
      - '!CONTRIBUTING.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: DevMemoir CI / verify
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devmemoir
          POSTGRES_PASSWORD: devmemoir
          POSTGRES_DB: devmemoir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmemoir -d devmemoir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      DATABASE_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
      DATABASE_DIRECT_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
      TEST_DATABASE_URL: postgres://devmemoir:devmemoir@localhost:5432/devmemoir
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for non-documentation changes
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - 'README.md'
              - 'SECURITY.md'
              - 'CONTRIBUTING.md'
              - '!docs/**'
              - '!LICENSE'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      - name: Public repository current-tree check
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm audit:public
      - name: Assert PostgreSQL 18
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: |
          IMAGE="$(docker inspect --format '{{.Config.Image}}' "${{ job.services.postgres.id }}")"
          VERSION="$(docker exec "${{ job.services.postgres.id }}" psql -U devmemoir -d devmemoir -tAc 'SHOW server_version')"
          echo "PostgreSQL image: ${IMAGE}"
          echo "PostgreSQL server_version: ${VERSION}"
          case "${IMAGE}" in
            *postgres:18-alpine*) ;;
            *) echo "Expected image postgres:18-alpine, got ${IMAGE}" >&2; exit 1 ;;
          esac
          case "${VERSION}" in
            18.*) ;;
            *) echo "Expected PostgreSQL 18, got ${VERSION}" >&2; exit 1 ;;
          esac
      - name: Assert PostgreSQL integration configuration
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: test -n "$TEST_DATABASE_URL"
      - name: Apply empty/upgrade-safe migrations
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm db:migrate
      - name: Build
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm build
      - name: Typecheck
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm -r --if-present typecheck
      - name: Lint
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm lint
      - name: Unit, PostgreSQL integration, projection, RLS, and queue recovery tests
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm -r --if-present test
      - name: Synthetic owner journey through API and worker
        if: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        run: pnpm test:journey
